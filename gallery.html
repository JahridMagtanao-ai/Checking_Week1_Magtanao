<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pictures of pickleball: the court, equipment, and players.">
  <title>Gallery | Pickleball Fun</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">Pickleball Fun</a>
      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html" title="Welcome to Pickleball Fun">Home</a></li>
          <li><a href="about.html" title="What is pickleball?">About</a></li>
          <li><a href="rules.html" title="Learn the basic rules">Rules</a></li>
          <li><a href="gallery.html" aria-current="page" title="See pickleball photos">Gallery</a></li>
          <li><a href="ask.html" class="nav-cta" title="Ask a question or send a request">Ask Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- GALLERY: sample pictures. Replace the image files in assets/images/
         with your own photos using the same file names (or update the src paths). -->
    <section class="section">
      <div class="container">
        <h1>Gallery</h1>
        <p class="intro">A look at the court, the equipment, and the fun.</p>

        <div class="gallery-grid">
          <figure class="photo-box">
            <img src="assets/images/gallery-1.jpg" alt="Players enjoying a doubles pickleball game">
            <figcaption>Doubles game</figcaption>
          </figure>
          <figure class="photo-box">
            <img src="assets/images/gallery-2.jpg" alt="Pickleball paddles and balls on the ground">
            <figcaption>Paddles and balls</figcaption>
          </figure>
          <figure class="photo-box">
            <img src="assets/images/gallery-3.jpg" alt="A pickleball court with a net">
            <figcaption>The court and net</figcaption>
          </figure>
          <figure class="photo-box">
            <img src="assets/images/gallery-4.jpg" alt="A player serving the ball underhand">
            <figcaption>Underhand serve</figcaption>
          </figure>
          <figure class="photo-box">
            <img src="assets/images/gallery-5.jpg" alt="Friends smiling after a game">
            <figcaption>Fun with friends</figcaption>
          </figure>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="footer-copy">&copy; 2026 Pickleball Fun. All rights reserved.</p>
  </footer>
